[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eleagent-mcp"
version = "0.1.0"
description = "Read-only-first MCP tools for embedded/AUTOSAR engineering traceability"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2.0",
  "pymupdf>=1.23,<2.0",
]

[tool.setuptools]
py-modules = ["mcp_server"]
