name: Skill and MCP smoke tests

on:
  push:
    paths:
      - ".github/skills/autosar-hw-code-traceability/**"
      - ".github/skills/circuit-schematic-analysis/**"
      - "mcp_server.py"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "requirements.txt"
      - ".vscode/mcp.json"
      - ".github/workflows/skill-smoke-tests.yml"
  pull_request:
    paths:
      - ".github/skills/autosar-hw-code-traceability/**"
      - ".github/skills/circuit-schematic-analysis/**"
      - "mcp_server.py"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "requirements.txt"
      - ".vscode/mcp.json"
      - ".github/workflows/skill-smoke-tests.yml"
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python scripts
        run: python -m compileall -q .github/skills/autosar-hw-code-traceability/scripts .github/skills/circuit-schematic-analysis tests mcp_server.py
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate example traceability structure
        run: python .github/skills/autosar-hw-code-traceability/scripts/check_traceability.py examples/traceability.example.json
      - name: Export example PIN inventory to Excel
        run: python .github/skills/autosar-hw-code-traceability/scripts/export_pin_excel.py .github/skills/circuit-schematic-analysis/examples/hardware_inventory.example.json --out /tmp/pin_signal_inventory.xlsx
      - name: Generate review report from example
        run: python .github/skills/autosar-hw-code-traceability/scripts/build_review_report.py examples/traceability.example.json --out /tmp/review_report.md
