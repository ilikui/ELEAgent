name: Skill and MCP smoke tests

on:
  push:
    paths:
      - ".github/skills/autosar-hw-code-traceability/**"
      - ".github/skills/circuit-schematic-analysis/**"
      - ".github/skills/chip-datasheet-analysis/**"
      - "mcp_server.py"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "requirements.txt"
      - ".vscode/mcp.json"
      - ".github/workflows/skill-smoke-tests.yml"
  pull_request:
    paths:
      - ".github/skills/autosar-hw-code-traceability/**"
      - ".github/skills/circuit-schematic-analysis/**"
      - ".github/skills/chip-datasheet-analysis/**"
      - "mcp_server.py"
      - "tests/**"
      - "schemas/**"
      - "examples/**"
      - "requirements.txt"
      - ".vscode/mcp.json"
      - ".github/workflows/skill-smoke-tests.yml"
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python scripts
        run: python -m compileall -q .github/skills/autosar-hw-code-traceability/scripts .github/skills/circuit-schematic-analysis .github/skills/chip-datasheet-analysis tests mcp_server.py
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate example traceability structure
        run: python .github/skills/autosar-hw-code-traceability/scripts/check_traceability.py examples/traceability.example.json
      - name: Extract candidate tables from generated sample PDF
        run: |
          python - <<'PY'
          import fitz
          with fitz.open() as doc:
              page = doc.new_page()
              page.insert_text((72, 72), "GPIO register and pin function overview")
              doc.save("/tmp/chip_manual_sample.pdf")
          PY
          python .github/skills/autosar-hw-code-traceability/scripts/extract_chip_tables.py /tmp/chip_manual_sample.pdf --out /tmp/chip_manual_tables.json
      - name: Test chip table normalization
        run: python -m unittest discover -s tests -p "test_normalize_chip_tables.py" -v
      - name: Test chip identity review
        run: python -m unittest discover -s tests -p "test_review_chip_identity.py" -v
      - name: Export example PIN inventory to Excel
        run: python .github/skills/autosar-hw-code-traceability/scripts/export_pin_excel.py .github/skills/circuit-schematic-analysis/examples/hardware_inventory.example.json --out /tmp/pin_signal_inventory.xlsx
      - name: Generate review report from example
        run: python .github/skills/autosar-hw-code-traceability/scripts/build_review_report.py examples/traceability.example.json --out /tmp/review_report.md
